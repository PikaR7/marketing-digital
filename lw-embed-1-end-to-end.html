<!-- Loftware embed 1: End-to-end product identification (white dot travels left to right) -->
<div class="lw-e2e">
<style>
.lw-e2e{--lw-bg:#0A1450;--lw-cyan:#1FD4FF;--lw-blue:#0072EB;--lw-orange:#F87D47;--lw-navy:#0E1D77;
  background:var(--lw-bg);color:#fff;font-family:Roboto,"Segoe UI",Arial,sans-serif;padding:24px;box-sizing:border-box;container-type:inline-size;width:100%}
.lw-e2e *{box-sizing:border-box;margin:0}
.lw-e2e .lw-card{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:#0C1A63;padding:clamp(18px,3.2cqw,34px) clamp(18px,3.4cqw,36px)}
.lw-e2e .lw-head{display:flex;justify-content:space-between;gap:12px;font-size:clamp(10px,1.35cqw,14px);font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.lw-e2e .lw-head span:first-child{color:rgba(255,255,255,.82)}
.lw-e2e .lw-head span:last-child{color:var(--lw-orange)}
.lw-e2e .lw-row{position:relative;display:flex;margin:clamp(18px,3cqw,30px) 0 clamp(20px,3.2cqw,32px)}
.lw-e2e .lw-track{position:absolute;left:10%;right:10%;top:calc(var(--d)/2);height:3px;transform:translateY(-50%);
  background:linear-gradient(90deg,var(--lw-blue) 0%,var(--lw-cyan) 70%,#B58C7A 82%,var(--lw-orange) 100%);border-radius:2px}
.lw-e2e .lw-row{--d:clamp(46px,11cqw,96px)}
.lw-e2e .lw-dot{position:absolute;top:calc(var(--d)/2);left:10%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px 2px rgba(255,255,255,.9),0 0 18px 6px rgba(31,212,255,.55);z-index:1;animation:lw-e2e-run 3.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes lw-e2e-run{0%{left:10%;opacity:0}6%{opacity:1}92%{opacity:1}100%{left:90%;opacity:0}}
.lw-e2e .lw-node{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4cqw,14px);position:relative;z-index:2}
.lw-e2e .lw-ring{width:var(--d);height:var(--d);border-radius:50%;border:2px solid var(--lw-cyan);background:#0E1D77;display:grid;place-items:center;
  box-shadow:0 0 0 4px rgba(31,212,255,.08)}
.lw-e2e .lw-node.lw-end .lw-ring{border-color:var(--lw-orange);background:#0A1450;box-shadow:0 0 0 4px rgba(248,125,71,.08)}
.lw-e2e .lw-ring svg{width:56%;height:56%}
.lw-e2e .lw-label{font-size:clamp(10px,1.7cqw,17px);font-weight:700;text-align:center;white-space:nowrap}
.lw-e2e .lw-scale{display:flex;align-items:center;gap:clamp(10px,2cqw,20px);font-size:clamp(10px,1.35cqw,14px);font-weight:700;letter-spacing:.22em}
.lw-e2e .lw-bar{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--lw-cyan),#9AA7B8 60%,var(--lw-orange))}
@container (max-width:520px){
  .lw-e2e .lw-label{font-size:9px;white-space:normal}
  .lw-e2e .lw-head{flex-direction:column;gap:6px}
  .lw-e2e .lw-scale{letter-spacing:.1em;font-size:9px}
}
@media (prefers-reduced-motion:reduce){.lw-e2e .lw-dot{animation:none;opacity:0}}
</style>
<div class="lw-card">
  <div class="lw-head"><span>End-to-end product identification</span><span>One provider</span></div>
  <div class="lw-row">
    <div class="lw-track"></div>
    <div class="lw-dot"></div>
    <div class="lw-node"><div class="lw-ring">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 40V12l12-4v32M18 40V16h10v24"/><path d="M10 16h4M10 22h4M10 28h4M22 22h2M22 28h2"/><path d="M26 30h10l4 5v5H26z"/><circle cx="30" cy="41" r="2.5" fill="#0E1D77"/><circle cx="38" cy="41" r="2.5" fill="#0E1D77"/></svg>
    </div><span class="lw-label">Supplier</span></div>
    <div class="lw-node"><div class="lw-ring">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 40V24l8-5v5l8-5v5l8-5v21z"/><path d="M8 40V10h4v12"/><path d="M11 32h4M19 32h4"/><circle cx="35" cy="14" r="4"/><path d="M35 6v3M35 19v3M27 14h3M40 14h3M29.5 8.5l2 2M38.5 17.5l2 2M29.5 19.5l2-2M38.5 10.5l2-2"/><path d="M30 40V24h12v16z"/><path d="M4 40h40"/></svg>
    </div><span class="lw-label">Manufacturer</span></div>
    <div class="lw-node"><div class="lw-ring">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M8 32V16l16-8 16 8v16"/><path d="M14 32V20h20v12M14 24h20M14 28h20"/><path d="M24 34v10M20 41l4 4 4-4M4 38h10M7 35l-3 3 3 3M34 38h10M41 35l3 3-3 3"/></svg>
    </div><span class="lw-label">Distributor</span></div>
    <div class="lw-node"><div class="lw-ring">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M8 10h32l4 10H4z"/><path d="M4 20c0 3 3 5 5 5s5-2 5-5c0 3 3 5 5 5s5-2 5-5c0 3 3 5 5 5s5-2 5-5c0 3 3 5 5 5s5-2 5-5"/><path d="M8 25v15h32V25"/><path d="M13 40V30h8v10M26 30h9v6h-9z"/><path d="M14 10v10M24 10v10M34 10v10"/></svg>
    </div><span class="lw-label">Seller</span></div>
    <div class="lw-node lw-end"><div class="lw-ring">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7FE6FF" stroke-width="3" stroke-linecap="round"><path d="M12 12v24M18 12v24M24 12v24M30 12v24M36 12v24"/></svg>
    </div><span class="lw-label">Consumer</span></div>
  </div>
  <div class="lw-scale"><span>SMB</span><div class="lw-bar"></div><span>GLOBAL ENTERPRISE</span></div>
</div>
</div>
